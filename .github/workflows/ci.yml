name: CI
on:
  push: { branches: [main] }
  pull_request:
  workflow_dispatch:
  schedule:
    # Early warning that the SDK broke us, before a user finds out.
    - cron: '17 6 * * *'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ['22', '24']
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with: { node-version: '${{ matrix.node }}', cache: npm }
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm run lint
      # Build before testing so test/unit/bundle.test.ts actually runs: it
      # asserts ink stays out of the one-shot path, which is only observable
      # in dist/ and skips itself when dist/ is absent.
      - run: npm run build
      - run: npm test
      # Exactly one copy of quais, and within the SDK's declared peer range.
      # `--legacy-peer-deps` can bypass the allowlist silently.
      - name: quais is single-copy and in range
        run: |
          COUNT=$(npm ls quais --json | node -e "
            let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{
              const seen=new Set();
              (function walk(n){ if(!n)return;
                for (const [k,v] of Object.entries(n.dependencies||{})) {
                  if (k==='quais' && v.version) seen.add(v.version);
                  walk(v);
                }})(JSON.parse(s));
              console.log(seen.size);
            })")
          test "$COUNT" = "1" || { echo "expected 1 quais version, found $COUNT"; exit 1; }
          node -e "
            const {createRequire}=require('node:module');const r=createRequire(process.cwd()+'/x.js');
            const range=require('./node_modules/@quaivault/sdk/package.json').peerDependencies.quais;
            const entry=r.resolve('quais');const m='/quais/';
            const v=require(entry.slice(0,entry.lastIndexOf(m)+m.length)+'package.json').version;
            if(!range.split('||').map(s=>s.trim()).includes(v)){
              console.error('quais '+v+' outside SDK peer range '+range); process.exit(1);}
            console.log('quais '+v+' in range '+range);"
      - run: npm audit signatures

  package:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ['22', '24']
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with: { node-version: '${{ matrix.node }}', cache: npm }
      - run: npm ci --ignore-scripts
      - run: npm run build
      # Export-map, shebang, executable-bit and ESM-under-npx failures are
      # invisible to source-tree tests. This is the only thing that catches them.
      - name: pack, install clean, run
        run: |
          npm pack
          mkdir -p /tmp/consumer && cd /tmp/consumer && npm init -y >/dev/null
          npm install "$GITHUB_WORKSPACE"/quaivault-cli-*.tgz
          ./node_modules/.bin/qv --version
          ./node_modules/.bin/quaivault --help >/dev/null
          ./node_modules/.bin/qv addr check 0x0081f4e8a9b0c1d2e3f405162738495a6b7c8d78 | grep -q "NOT usable"
      # A unit test can check the generated text; only a shell can check that
      # it parses. Both bash and zsh ship on the runner.
      - name: generated completion scripts parse in their shells
        run: |
          node dist/qv.js completion bash > /tmp/qv.bash
          node dist/qv.js completion zsh  > /tmp/_qv
          node dist/qv.js completion fish > /tmp/qv.fish
          bash -n /tmp/qv.bash
          zsh -n /tmp/_qv
          # Sourcing it and driving one completion catches a script that
          # parses but produces nothing.
          bash -c 'source /tmp/qv.bash
            COMP_WORDS=(qv tx a); COMP_CWORD=2; _qv_complete
            test "${COMPREPLY[0]}" = "approve" || { echo "completion produced: ${COMPREPLY[*]}"; exit 1; }'
      - name: no unexpected files in the tarball
        run: |
          npm pack --dry-run --json | node -e "
            let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{
              const files=JSON.parse(s)[0].files.map(f=>f.path);
              const bad=files.filter(f=>!/^(dist\/|README|LICENSE|package\.json)/.test(f));
              if(bad.length){console.error('unexpected in tarball:',bad);process.exit(1)}
              console.log(files.length+' files, all expected');
            })"

  # Tier 4 (plan §6, R1). Runs against @quaivault/sdk@latest rather than the
  # pin, so the SDK moving under us surfaces here on a schedule instead of in
  # a user's terminal. Deliberately never part of the PR gate: it is expected
  # to go red on its own, and a red gate that nobody can fix by editing their
  # own branch is a gate people learn to ignore.
  #
  # A typecheck alone would not be enough. When `proposedAt` became 0 on
  # indexer reads the type never changed, only the meaning did -- so
  # test/contract asserts behaviour, not shape.
  sdk-contract:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with: { node-version: '22', cache: npm }
      - run: npm ci --ignore-scripts
      - name: baseline — the pinned SDK must be green before we blame @latest
        run: npm run test:sdk-contract
      - name: install @quaivault/sdk@latest
        id: bump
        run: |
          PINNED=$(node -p "require('./node_modules/@quaivault/sdk/package.json').version")
          # An ERESOLVE here is itself the finding: the new SDK widened or
          # moved its quais peer allowlist away from the version we declare.
          npm install --ignore-scripts @quaivault/sdk@latest
          LATEST=$(node -p "require('./node_modules/@quaivault/sdk/package.json').version")
          echo "pinned=$PINNED" >> "$GITHUB_OUTPUT"
          echo "latest=$LATEST" >> "$GITHUB_OUTPUT"
          echo "### SDK contract check" >> "$GITHUB_STEP_SUMMARY"
          echo "pinned \`$PINNED\` → latest \`$LATEST\`" >> "$GITHUB_STEP_SUMMARY"
          if [ "$PINNED" = "$LATEST" ]; then
            echo "no new release; this run only reconfirms the pin" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: quais is still single-copy and inside the new peer range
        run: |
          npm ls quais
          node -e "
            const range=require('./node_modules/@quaivault/sdk/package.json').peerDependencies.quais;
            const v=require('./node_modules/quais/package.json').version;
            if(!range.split('||').map(s=>s.trim()).includes(v)){
              console.error('quais '+v+' outside new SDK peer range '+range);process.exit(1)}
            console.log('quais '+v+' in range '+range);"
      - name: typecheck against @latest
        run: npm run typecheck
      - name: semantic invariants against @latest
        run: npm run test:sdk-contract
      - name: full suite against @latest
        run: npm test
